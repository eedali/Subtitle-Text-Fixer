name: Build portable app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Run tests
        run: |
          python test_core.py
          xvfb-run python test_gui.py || python test_gui.py
        shell: bash
      - name: Build
        run: pyinstaller --clean --noconfirm subtitle_fixer.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleTextFixer-${{ matrix.os }}
          path: dist/SubtitleTextFixer/
